name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Choose build version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Expected a tag such as v0.1.1."
              exit 1
            fi
            version="${REF_NAME#v}"
          else
            version="0.0.0-dev"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Check source
        run: make check

      - name: Build packages and checksums
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          packages="$GITHUB_WORKSPACE/bin/release/packages"
          mkdir -p "$packages"

          for target in darwin/arm64 linux/amd64 windows/amd64; do
            target_os="${target%/*}"
            target_arch="${target#*/}"
            build_dir="$RUNNER_TEMP/gmeter-${target_os}-${target_arch}"
            executable="gmeter"
            if [[ "$target_os" == "windows" ]]; then
              executable="gmeter.exe"
            fi
            mkdir -p "$build_dir"

            CGO_ENABLED=0 GOOS="$target_os" GOARCH="$target_arch" go build \
              -trimpath \
              -ldflags="-X gmeter/internal/cli.Version=$VERSION" \
              -o "$build_dir/$executable" ./cmd/gmeter

            archive="gmeter_${VERSION}_${target_os}_${target_arch}"
            if [[ "$target_os" == "windows" ]]; then
              (cd "$build_dir" && zip "$packages/$archive.zip" "$executable")
            else
              tar -czf "$packages/$archive.tar.gz" -C "$build_dir" "$executable"
            fi
          done

          actual_version="$("$RUNNER_TEMP/gmeter-linux-amd64/gmeter" version)"
          [[ "$actual_version" == "gmeter $VERSION" ]]
          echo "$actual_version"

          cd "$packages"
          sha256sum *.tar.gz *.zip > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Save build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gmeter-packages-${{ steps.version.outputs.value }}
          path: bin/release/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" bin/release/packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "gmeter $TAG_NAME" \
            --generate-notes
